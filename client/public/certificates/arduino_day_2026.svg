<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="arduinoTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008184"/>
      <stop offset="50%" stop-color="#00979d"/>
      <stop offset="100%" stop-color="#055e62"/>
    </linearGradient>
    <linearGradient id="goldAngle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#cbd5e1" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Clean Background with Dot Grid -->
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect width="1200" height="800" fill="url(#dotGrid)"/>

  <!-- Top-Left Angled Geometric Ribbons -->
  <polygon points="0,0 260,0 160,180 0,140" fill="url(#arduinoTeal)"/>
  <polygon points="0,0 120,0 0,220" fill="#006468"/>
  <polygon points="260,0 310,0 210,180 160,180" fill="url(#goldAngle)"/>

  <!-- Top-Right Geometric Accents -->
  <polygon points="980,0 1200,0 1200,260 1060,120" fill="url(#arduinoTeal)"/>
  <polygon points="940,0 980,0 1060,120 1020,120" fill="url(#goldAngle)"/>

  <!-- Bottom-Left Geometric Ribbons -->
  <polygon points="0,800 0,600 120,700 80,800" fill="url(#arduinoTeal)"/>
  <polygon points="0,800 80,800 120,700 140,800" fill="url(#goldAngle)"/>

  <!-- Bottom-Right Geometric Ribbons -->
  <polygon points="1200,800 940,800 1080,620 1200,660" fill="url(#arduinoTeal)"/>
  <polygon points="1200,800 1200,580 1100,700 1160,800" fill="#006468"/>
  <polygon points="940,800 890,800 1030,620 1080,620" fill="url(#goldAngle)"/>

  <!-- 3D Grid Perspective Floor at Bottom -->
  <g opacity="0.25">
    <line x1="200" y1="800" x2="600" y2="650" stroke="#00979d" stroke-width="1.5"/>
    <line x1="350" y1="800" x2="600" y2="650" stroke="#00979d" stroke-width="1.5"/>
    <line x1="500" y1="800" x2="600" y2="650" stroke="#00979d" stroke-width="1.5"/>
    <line x1="600" y1="800" x2="600" y2="650" stroke="#00979d" stroke-width="1.5"/>
    <line x1="700" y1="800" x2="600" y2="650" stroke="#00979d" stroke-width="1.5"/>
    <line x1="850" y1="800" x2="600" y2="650" stroke="#00979d" stroke-width="1.5"/>
    <line x1="1000" y1="800" x2="600" y2="650" stroke="#00979d" stroke-width="1.5"/>
    <line x1="260" y1="740" x2="940" y2="740" stroke="#00979d" stroke-width="1.5"/>
    <line x1="380" y1="690" x2="820" y2="690" stroke="#00979d" stroke-width="1.5"/>
  </g>

  <!-- Title Header -->
  <text x="600" y="175" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="#008184" letter-spacing="3">CERTIFICATE OF PARTICIPATION</text>
  <text x="600" y="235" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" text-anchor="middle" fill="#008184" letter-spacing="3">THIS CERTIFICATE IS AWARDED TO</text>

  <!-- Awardee Name -->
  <text x="600" y="335" font-family="'Arial Black', Arial, sans-serif" font-size="54" font-weight="900" text-anchor="middle" fill="#008184" letter-spacing="1">Chaelvin Bolante</text>

  <!-- Body Text Paragraphs -->
  <text x="600" y="395" font-family="Arial, sans-serif" font-size="14.5" font-style="italic" text-anchor="middle" fill="#1e293b">
    In recognition of active participation in the workshops, booths, and talks of <tspan font-weight="bold" font-style="normal" fill="#000000">Arduino Day Philippines 2026.</tspan>
  </text>

  <g font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#334155" text-anchor="middle">
    <text x="600" y="435">This acknowledgment celebrates the enthusiasm, engagement, and commitment to learning demonstrated</text>
    <text x="600" y="455">throughout the event. Through participation, a strong passion for innovation, collaboration, and the</text>
    <text x="600" y="475">advancement of electronics, engineering, and open-source technology has been exemplified.</text>

    <text x="600" y="515">This experience reflects a dedication to expanding knowledge, sharing ideas, and contributing to a growing</text>
    <text x="600" y="535">community of makers and innovators. May this milestone serve as inspiration to continue exploring new</text>
    <text x="600" y="555">possibilities and transforming ideas into meaningful technological solutions that shape the future.</text>
  </g>

  <!-- Arduino Day 2026 Philippines Emblem Logo Bottom Center -->
  <g transform="translate(600, 680)">
    <!-- Infinity loop -->
    <path d="M-35,0 C-35,-16 -18,-16 -10,0 C-2,16 15,16 15,0 C15,-16 -2,-16 -10,0 C-18,16 -35,16 -35,0 Z" fill="none" stroke="#00979d" stroke-width="7"/>
    <circle cx="-22" cy="0" r="14" fill="#00979d"/>
    <text x="-22" y="5" font-family="'Arial Black'" font-size="18" fill="#ffffff" text-anchor="middle">+</text>
    <circle cx="5" cy="0" r="14" fill="#f59e0b"/>
    <text x="5" y="4" font-family="'Arial Black'" font-size="18" fill="#ffffff" text-anchor="middle">-</text>

    <text x="35" y="-5" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#008184" letter-spacing="1">ARDUINO</text>
    <text x="35" y="8" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#008184">DAYS 2026</text>
    <text x="0" y="32" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#00979d" letter-spacing="3">PHILIPPINES</text>
  </g>
</svg>
