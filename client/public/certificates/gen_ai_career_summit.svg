<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="40%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#090214"/>
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Dark Synthwave Background -->
  <rect width="1200" height="800" fill="url(#purpleGlow)"/>

  <!-- Glowing Mesh Ribbon Wave -->
  <path d="M 0,280 Q 300,180 600,280 T 1200,260 L 1200,800 L 0,800 Z" fill="#130826" opacity="0.9"/>
  <path d="M 0,260 Q 300,380 600,260 T 1200,320" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6"/>
  <path d="M 0,270 Q 300,390 600,270 T 1200,330" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.5"/>
  <path d="M 0,280 Q 300,400 600,280 T 1200,340" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>

  <!-- Sleek Border -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#7e22ce" stroke-width="1.5" opacity="0.7"/>
  <rect x="36" y="36" width="1128" height="728" fill="none" stroke="#ec4899" stroke-width="0.8" opacity="0.5"/>

  <!-- Sponsor Header Strip -->
  <g transform="translate(600, 60)">
    <text x="-480" y="0" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#94a3b8" letter-spacing="1">POWERED BY</text>
    <text x="-370" y="0" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#f43f5e">PIXEL</text>
    <text x="-300" y="0" font-family="'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#ffffff">SPM</text>
    <text x="-210" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">InLife Foundation</text>
    <text x="-90" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fb923c">Alibaba Cloud</text>
    
    <text x="180" y="0" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#94a3b8" letter-spacing="1">BROUGHT TO YOU BY</text>
    <text x="320" y="0" font-family="Arial, sans-serif" font-size="9" fill="#e2e8f0">JoyRide • Eskwelabs • Potico</text>
  </g>

  <!-- Hosts: VIBE CODERS PH & EMC² FRATERNITY UP DILIMAN -->
  <g transform="translate(600, 130)">
    <!-- Vibe Coders -->
    <g transform="translate(-160, 0)">
      <polygon points="-120,-10 -130,0 -120,10 -115,5 -122,0 -115,-5" fill="#c084fc"/>
      <polygon points="-110,-10 -100,0 -110,10 -115,5 -108,0 -115,-5" fill="#ec4899"/>
      <text x="-90" y="4" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">VIBE CODERS PH</text>
    </g>

    <!-- EMC² Fraternity -->
    <g transform="translate(160, 0)">
      <circle cx="-130" cy="0" r="14" fill="#047857"/>
      <text x="-130" y="5" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#fef08a">EMC²</text>
      <text x="-105" y="-2" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1">EMC² FRATERNITY</text>
      <text x="-105" y="10" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#a7f3d0" letter-spacing="1">UNIVERSITY OF THE PHILIPPINES</text>
    </g>
  </g>

  <!-- Main Certificate Title -->
  <text x="600" y="235" font-family="'Arial Black', Arial, sans-serif" font-size="52" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="4">CERTIFICATE</text>
  <text x="600" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ec4899" letter-spacing="4">OF PARTICIPATION</text>

  <text x="600" y="325" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#cbd5e1" letter-spacing="2">IS PRESENTED TO:</text>

  <!-- Awardee Name in Script Lettering -->
  <text x="600" y="405" font-family="'Georgia', serif" font-style="italic" font-size="54" font-weight="bold" text-anchor="middle" fill="#ffffff">Chaelvin B. Bolante</text>
  <line x1="280" y1="425" x2="920" y2="425" stroke="url(#neonPink)" stroke-width="2"/>

  <!-- Body Text -->
  <text x="600" y="475" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#e2e8f0">
    in recognition of their commitment to learning and growth as a participant at
  </text>
  <text x="600" y="505" font-family="'Arial Black', Arial, sans-serif" font-size="19" font-weight="900" text-anchor="middle" fill="#38bdf8" letter-spacing="0.5">
    GEN AI TO Z: A Career Summit in an AI-driven World.
  </text>

  <text x="600" y="565" font-family="Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#cbd5e1">
    Given this <tspan font-weight="bold" fill="#ffffff">17th day of March 2026</tspan> at the <tspan font-weight="bold" fill="#ffffff">David M. Consunji Theater, Institute of Civil Engineering, UP Diliman.</tspan>
  </text>

  <!-- Cute AI Bot Mascot Emblem in Bottom Left -->
  <g transform="translate(140, 680)">
    <circle cx="0" cy="0" r="38" fill="#1e103a" stroke="#ec4899" stroke-width="2"/>
    <circle cx="0" cy="0" r="28" fill="#f472b6"/>
    <circle cx="-9" cy="-3" r="4.5" fill="#0f172a"/>
    <circle cx="9" cy="-3" r="4.5" fill="#0f172a"/>
    <circle cx="-10" cy="-4" r="1.5" fill="#ffffff"/>
    <circle cx="8" cy="-4" r="1.5" fill="#ffffff"/>
    <path d="M-6,8 Q0,14 6,8" fill="none" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="-16" cy="4" rx="4" ry="2" fill="#fb7185"/>
    <ellipse cx="16" cy="4" rx="4" ry="2" fill="#fb7185"/>
  </g>

  <!-- Signatures -->
  <!-- Left Signatory: Mr. Viron Gil Estrada -->
  <g transform="translate(420, 670)">
    <path d="M-40,5 Q-15,-30 15,5 Q40,-25 65,10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="38" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#ffffff">MR. VIRON GIL ESTRADA</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a855f7">Event Director</text>
  </g>

  <!-- Right Signatory: Dr. Jayson Cunanan -->
  <g transform="translate(780, 670)">
    <path d="M-35,10 Q-5,-25 25,5 Q55,-20 80,15" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="-80" y1="20" x2="80" y2="20" stroke="#64748b" stroke-width="1"/>
    <text x="0" y="38" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#ffffff">DR. JAYSON CUNANAN</text>
    <text x="0" y="55" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#a855f7">Mentor</text>
  </g>

  <!-- QR Code & Cert Code Bottom Right -->
  <g transform="translate(1080, 680)">
    <rect x="-35" y="-35" width="70" height="70" fill="#ffffff" rx="4"/>
    <!-- Mock QR pattern -->
    <rect x="-28" y="-28" width="18" height="18" fill="#130826"/>
    <rect x="10" y="-28" width="18" height="18" fill="#130826"/>
    <rect x="-28" y="10" width="18" height="18" fill="#130826"/>
    <rect x="-6" y="-6" width="12" height="12" fill="#ec4899"/>
    <text x="0" y="52" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle" fill="#a855f7">GAI2Z26-D98B</text>
  </g>
</svg>
