<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="navyEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Clean Off-White Background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Geometric Corner Accents (Navy & Gold) -->
  <polygon points="0,0 220,0 0,220" fill="url(#navyEdge)"/>
  <polygon points="0,0 150,0 0,150" fill="url(#goldEdge)" opacity="0.85"/>

  <polygon points="1200,0 980,0 1200,220" fill="url(#goldEdge)"/>
  <polygon points="1200,0 1050,0 1200,150" fill="url(#navyEdge)" opacity="0.85"/>

  <polygon points="0,800 220,800 0,580" fill="url(#goldEdge)"/>
  <polygon points="0,800 150,800 0,650" fill="url(#navyEdge)" opacity="0.85"/>

  <polygon points="1200,800 980,800 1200,580" fill="url(#navyEdge)"/>
  <polygon points="1200,800 1050,800 1200,650" fill="url(#goldEdge)" opacity="0.85"/>

  <!-- Elegant Double Border -->
  <rect x="40" y="40" width="1120" height="720" fill="none" stroke="url(#goldEdge)" stroke-width="2"/>
  <rect x="48" y="48" width="1104" height="704" fill="none" stroke="#1e3a8a" stroke-width="1.2"/>

  <!-- Header Sponsor Logos -->
  <g transform="translate(600, 110)">
    <!-- StartupLab -->
    <g transform="translate(-230, 0)">
      <text x="0" y="0" font-family="'Arial Black', Arial, sans-serif" font-size="28" font-weight="900" text-anchor="middle" fill="#0284c7">Startup<tspan fill="#0f172a">Lab</tspan></text>
      <text x="0" y="16" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#64748b" letter-spacing="4">BUSINESS CENTER</text>
    </g>

    <!-- Intern Heroes -->
    <g transform="translate(0, 0)">
      <rect x="-60" y="-20" width="120" height="32" rx="4" fill="#0f172a"/>
      <polygon points="-45,-5 -35,-5 -40,12" fill="#eab308"/>
      <text x="5" y="-3" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1">INTERN</text>
      <text x="5" y="9" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#eab308" letter-spacing="1">HEROES</text>
    </g>

    <!-- Simply Source -->
    <g transform="translate(230, 0)">
      <circle cx="-60" cy="-4" r="16" fill="#1e3a8a"/>
      <text x="-60" y="2" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#ffffff">S</text>
      <text x="-35" y="-8" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">Simply</text>
      <text x="-35" y="8" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#0f172a">Source</text>
    </g>
  </g>

  <!-- Big Title -->
  <text x="600" y="210" font-family="'Arial Black', Arial, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="#0f2b48" letter-spacing="3">CERTIFICATE</text>
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#64748b" letter-spacing="4">OF COMPLETION</text>

  <text x="600" y="290" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#64748b" letter-spacing="2">THIS CERTIFICATE IS PRESENTED TO</text>

  <!-- Awardee Name (Calligraphy / Script effect) -->
  <text x="600" y="365" font-family="'Georgia', serif" font-style="italic" font-size="52" font-weight="bold" text-anchor="middle" fill="#1e4e79">Chaelvin Bolante</text>
  <line x1="320" y1="380" x2="880" y2="380" stroke="url(#goldEdge)" stroke-width="1.5"/>

  <!-- Body Text -->
  <text x="600" y="425" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">
    a <tspan font-weight="bold" fill="#0f172a">3rd Year BS Computer Engineering</tspan> student from <tspan font-weight="bold" fill="#0f172a">Cavite State University –</tspan>
  </text>
  <text x="600" y="452" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#334155">
    <tspan font-weight="bold" fill="#0f172a">CCAT Campus</tspan>, has successfully completed <tspan font-weight="bold" fill="#0f172a">240 hours</tspan> of internship as a
  </text>
  <text x="600" y="482" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0284c7">
    Web Developer <tspan font-weight="normal" fill="#334155">from</tspan> July 14 <tspan font-weight="normal" fill="#334155">to</tspan> August 18, 2025.
  </text>

  <text x="600" y="540" font-family="Arial, sans-serif" font-size="13.5" text-anchor="middle" fill="#475569">
    Issued this <tspan font-weight="bold">22nd day of August 2025</tspan> at <tspan font-weight="bold">StartupLab Business Center</tspan>,
  </text>
  <text x="600" y="562" font-family="Arial, sans-serif" font-size="13.5" text-anchor="middle" fill="#475569">
    General Trias, Cavite, Philippines.
  </text>

  <!-- Laurel Wreath in Center Bottom -->
  <g transform="translate(600, 630)">
    <path d="M-15,-20 Q-25,-10 -25,10 Q-20,25 0,35 Q20,25 25,10 Q25,-10 15,-20" fill="none" stroke="url(#goldEdge)" stroke-width="2"/>
    <circle cx="-12" cy="-10" r="3" fill="#d97706"/>
    <circle cx="-20" cy="5" r="3" fill="#d97706"/>
    <circle cx="-15" cy="20" r="3" fill="#d97706"/>
    <circle cx="12" cy="-10" r="3" fill="#d97706"/>
    <circle cx="20" cy="5" r="3" fill="#d97706"/>
    <circle cx="15" cy="20" r="3" fill="#d97706"/>
  </g>

  <!-- Signatures -->
  <!-- Left Signature: Renz Roderno Briones -->
  <g transform="translate(300, 640)">
    <path d="M-40,15 Q-10,-25 10,15 Q30,-20 60,10" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="-80" y1="25" x2="80" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Renz Roderno Briones</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Internship Coordinator</text>
  </g>

  <!-- Right Signature: Stephanie Escalona -->
  <g transform="translate(900, 640)">
    <path d="M-30,5 Q-10,-30 20,-5 Q40,-25 60,15" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="-80" y1="25" x2="80" y2="25" stroke="#94a3b8" stroke-width="1"/>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Stephanie Escalona</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Head of HR</text>
  </g>
</svg>
