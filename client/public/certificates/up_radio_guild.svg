<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="darkRoyal" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0f2b2b"/>
      <stop offset="50%" stop-color="#08181c"/>
      <stop offset="100%" stop-color="#030a0d"/>
    </radialGradient>
    <linearGradient id="goldVintage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
  </defs>

  <!-- Deep Emerald-Navy Gradient Background -->
  <rect width="1200" height="800" fill="url(#darkRoyal)"/>

  <!-- Ornate Decorative Vintage Gold Border Frame -->
  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="url(#goldVintage)" stroke-width="3"/>
  <rect x="35" y="35" width="1130" height="730" fill="none" stroke="#ca8a04" stroke-width="1" stroke-dasharray="4,2"/>
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="url(#goldVintage)" stroke-width="1.5"/>

  <!-- Corner Flourishes -->
  <g stroke="url(#goldVintage)" stroke-width="2" fill="none">
    <path d="M 25,70 Q 55,55 70,25"/>
    <path d="M 1175,70 Q 1145,55 1130,25"/>
    <path d="M 25,730 Q 55,745 70,775"/>
    <path d="M 1175,730 Q 1145,745 1130,775"/>
  </g>

  <!-- Header Logos -->
  <!-- Top Left: 90 UP Engineering Radio Guild -->
  <g transform="translate(110, 80)">
    <circle cx="-25" cy="0" r="16" fill="#ca8a04"/>
    <text x="-25" y="6" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#000000">90</text>
    <text x="0" y="-3" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1">Engineering</text>
    <text x="0" y="9" font-family="'Arial Black', sans-serif" font-size="11" font-weight="900" fill="#fde047" letter-spacing="1">Radio Guild</text>
  </g>

  <!-- Top Right: EXCELSIS -->
  <g transform="translate(1090, 80)">
    <circle cx="-50" cy="0" r="14" fill="#1e3a8a"/>
    <text x="-28" y="5" font-family="'Times New Roman', serif" font-size="18" font-weight="bold" fill="url(#goldVintage)" letter-spacing="3">EXCELSIS</text>
  </g>

  <!-- Certificate Title -->
  <text x="600" y="160" font-family="'Times New Roman', Georgia, serif" font-size="62" font-weight="400" text-anchor="middle" fill="url(#goldVintage)" letter-spacing="8">CERTIFICATE</text>
  <text x="600" y="200" font-family="'Times New Roman', serif" font-size="20" font-style="italic" text-anchor="middle" fill="#cbd5e1" letter-spacing="4">OF PARTICIPATION</text>

  <!-- Presenter text -->
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#94a3b8" letter-spacing="1.5">
    The <tspan font-weight="bold" fill="#ffffff">UP Engineering Radio Guild</tspan> proudly presents this certificate to
  </text>

  <!-- Gold Accent Line with Diamond Orbs -->
  <line x1="160" y1="340" x2="1040" y2="340" stroke="url(#goldVintage)" stroke-width="2"/>
  <circle cx="160" cy="340" r="7" fill="#fde047"/>
  <circle cx="1040" cy="340" r="7" fill="#fde047"/>

  <!-- Awardee Name in Script Lettering -->
  <text x="600" y="325" font-family="'Georgia', serif" font-style="italic" font-size="54" font-weight="bold" text-anchor="middle" fill="#ffffff">Chaelvin B. Bolante</text>

  <!-- Body Text -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#cbd5e1">
    for completing the lectures on <tspan font-weight="bold" fill="#ffffff">Elements II (Rules and Regulations)</tspan>, <tspan font-weight="bold" fill="#ffffff">III (Fundamentals of Electronics and</tspan>
  </text>
  <text x="600" y="415" font-family="Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#cbd5e1">
    <tspan font-weight="bold" fill="#ffffff">Electricity)</tspan>, and <tspan font-weight="bold" fill="#ffffff">IV (Amateur Radio Practice)</tspan> of the <tspan font-weight="bold" fill="#fde047">Amateur Radio Operator Examination</tspan>, held on the <tspan font-weight="bold" fill="#ffffff">14th of</tspan>
  </text>
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="14.5" text-anchor="middle" fill="#cbd5e1">
    <tspan font-weight="bold" fill="#ffffff">March, 2026</tspan> at the <tspan font-weight="bold" fill="#ffffff">UP Diliman Electrical and Electronics Institute Building.</tspan>
  </text>

  <!-- Signatories Row (5 signatures across bottom) -->
  <g transform="translate(600, 560)">
    <!-- 1. John Louis Nieto -->
    <g transform="translate(-380, 0)">
      <path d="M-25,10 Q-5,-20 15,5 Q35,-15 50,10" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="-70" y1="20" x2="70" y2="20" stroke="#ca8a04" stroke-width="1"/>
      <text x="0" y="36" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#ffffff">JOHN LOUIS NIETO</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8">President</text>
      <text x="0" y="62" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#94a3b8">UP Engineering Radio Guild</text>
    </g>

    <!-- 2. Joegen Tristan Baclor -->
    <g transform="translate(-190, 0)">
      <path d="M-20,5 Q0,-25 20,5 Q35,-20 45,10" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="-70" y1="20" x2="70" y2="20" stroke="#ca8a04" stroke-width="1"/>
      <text x="0" y="36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">JOEGEN TRISTAN BACLOR, 4G1TMA</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="8.5" text-anchor="middle" fill="#94a3b8">VP for Technical &amp; Academic Concerns</text>
    </g>

    <!-- 3. Renzo Miguel Alido -->
    <g transform="translate(0, 0)">
      <path d="M-25,5 Q-5,-25 15,0 Q35,-20 45,15" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="-70" y1="20" x2="70" y2="20" stroke="#ca8a04" stroke-width="1"/>
      <text x="0" y="36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">RENZO MIGUEL ALIDO, 4G1TMO</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8">Radio Seminar Head</text>
    </g>

    <!-- 4. Hans Cecilio L. Bosshard -->
    <g transform="translate(190, 0)">
      <path d="M-25,10 Q-5,-15 15,10 Q35,-25 50,5" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="-70" y1="20" x2="70" y2="20" stroke="#ca8a04" stroke-width="1"/>
      <text x="0" y="36" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">HANS CECILIO L. BOSSHARD, DU1YKI</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8">Lecturer</text>
    </g>

    <!-- 5. Ramon R. Reyes -->
    <g transform="translate(380, 0)">
      <path d="M-30,5 Q-10,-25 15,5 Q35,-15 50,15" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="-70" y1="20" x2="70" y2="20" stroke="#ca8a04" stroke-width="1"/>
      <text x="0" y="36" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#ffffff">RAMON R. REYES, DU1FV</text>
      <text x="0" y="50" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8">DX1UP Trustee</text>
    </g>
  </g>

  <!-- Official Accreditation Footer -->
  <g transform="translate(600, 720)">
    <text x="-250" y="0" font-family="monospace" font-size="12" font-weight="bold" fill="#fde047">DX1UP</text>
    <text x="0" y="0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#cbd5e1">NTC Accreditation No. 259-19</text>
    <text x="250" y="0" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" fill="#cbd5e1">PARA Affiliation No. 0226-19</text>
  </g>
</svg>
